name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Cheat Clip Pro Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pillow

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Build Standalone Installer
        run: python scripts/build_installer.py

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatClipPro-Setup
          path: dist_installer/*.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe
          generate_release_notes: true
